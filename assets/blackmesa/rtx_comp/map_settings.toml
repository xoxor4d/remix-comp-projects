# #####################################################################################
#
# Unbake Model Transforms
# :: If a "static prop" has many unique hashes (remix) then it's likely that it's vertices contain world position data. This will prevent proper mesh-replacements in remix.
# :: Specifying a substring or preferably the checksum of the model you want to replace here will prevent position/rotation/normal information
#    from being backed into the model vertices and then use the fixed function world transform to transform it into the game world. 
# :: String checks are costly so keep entries as small as possible and scope them per map if possible. (Just use checksums!) Use entry 'ALL' if it's a model used throughout the game.
# :: This will cause issues with some models (mainly ones with sub-meshes)
# :: Do not specify models if you do not intend to replace them. There is no benefit.
# 
# :: Useful console command: 'xo_mapsettings_get_unbake_info' to log all currently visible model names to '/logs/mapsettings_unbake_info.log' and 'xo_debug_toggle_unbake_model_info' for visualizations
# ~~ Parameters:
#
# <map name> = {    per map
#   name = []       unbake transform data from model vertices which contain the specified substring     [string array]
#   checksum = []   ^ but using the mdl checksum                                                        [int array - hex format]
# }
#
# ALL = {           ^ on every map
#   name = []       ^                                                                                   [string array]
#   checksum = []   ^                                                                                   [int array - hex format]
# }                                                                                

[UNBAKE]

